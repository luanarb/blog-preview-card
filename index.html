<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">

    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

    <title>Frontend Mentor | Blog preview card</title>
</head>
<body>
    <main>
        <article class="card">
            <img class="imagem" src="./assets/images/illustration-article.svg" alt="Ilustração do artigo">
            <div class="conteudo">
                <span class="tag">Learning</span>

                <time datetime="2023-12-21">Published 21 Dec 2023</time>

                <h1 class="titulo">HTML & CSS foundations</h1> 
                <p class="resumo">These languages are the backbone of every website, defining structure, content, and presentation.</p>
            </div>
            <div class="autor">
                <img src="./assets/images/image-avatar.webp" alt="foto do autor">
                <p>Greg Hooper</p>
            </div>
        </article>
    </main>
    <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="https://github.com/luanarb">Luana</a>.
  </footer>
</body>
</html>
